<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <title>MyPage</title>
    <script type="module" src="./src/index.ts"></script>
    <style>
        html {
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            padding: 0;
        }
        #drag-handle , #inserter{
            display: block;
            position: fixed;
            width: 1.4em;
            height: 1.6em;
            padding: 0.2em 0.3em;
            box-sizing: border-box;
            content: "::";
            background-color: rgb(90%, 90%, 90%);
            cursor: grab;
            border-radius: 4px;
            box-shadow: 0 2px 2px #00000020;
            user-select: none;
        }

        #inserter {
            cursor: default;
            transform: translateX(-30px);
        }

        #editor {
            white-space: pre-wrap;
            width: 80vw;
            margin-left: auto;
            margin-right: auto;
            margin-top: 0;
            padding-top: 0;
        }

        .prosemirror-embedded-html {
            position: relative;
        }

        .prosemirror-htmleditor {
            position: absolute !important;
            top: 0;
            left: 0;
            z-index: 1000;
            background-color: red;
        }
    </style>
    <link rel="stylesheet" href="./style.sass"/>
    <link rel="stylesheet" href="./style/index.scss"/>
</head><body><div id="editor"></div>
</body>
<html>
