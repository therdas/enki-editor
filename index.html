<html lang="en" data-theme="light">
<head>
    <title>MyPage</title>
    <script type="module" src="./src/index.ts"></script>
    <style>
        html {
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            padding: 0;
        }
        #drag-handle , #inserter{
            display: block;
            position: fixed;
            width: 1.4em;
            height: 1.6em;
            padding: 0.2em 0.3em;
            box-sizing: border-box;
            content: "::";
            background-color: rgb(90%, 90%, 90%);
            cursor: grab;
            border-radius: 4px;
            box-shadow: 0 2px 2px #00000020;
            user-select: none;
        }

        #inserter {
            cursor: default;
            transform: translateX(-30px);
        }

        #editor {
            white-space: pre-wrap;
            width: 80vw;
            margin-left: auto;
            margin-right: auto;
            margin-top: 0;
            padding-top: 0;
        }

        .prosemirror-embedded-html {
            position: relative;
        }

        .prosemirror-htmleditor {
            position: absolute !important;
            top: 0;
            left: 0;
            z-index: 1000;
            background-color: red;
        }
    </style>
    <link rel="stylesheet" href="./style.sass"/>
    <link rel="stylesheet" href="./style/index.scss"/>

    <style>
        /* The default ID for the decoration, can override with decorationAttrs = { id: 'something' }  */
        .autocomplete {
            color: blue;
            border: 1px solid #333;
            border-radius: 2px 2px 0 0;
            border-bottom-color: white;
            padding: 2px 5px;
        }

        #info {
            margin-top: 1em;
            background-color: transparent;
            min-height: 1.5em;
            display: block;
        }

        #suggestion {
            position: absolute;
            border-radius: 2px;
            border: 1px solid #333;
            min-width: 300px;
            background-color: white;
            padding: 10px;
            transform: translateY(-1px);
        }

        /* You actually should do the UI with a mouse enter event rather than css hover */
        #suggestion:hover .selected {
            background-color: white;
        }

        #suggestion:hover>div:hover,
        #suggestion .selected {
            background-color: wheat;
            cursor: pointer;
            height: auto;
        }
    </style>
</head><body><div id="editor"></div>
</body>
<html>
